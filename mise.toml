[tools]
java = 'temurin-8.0.472+8'
gradle = '3.0.0'

[env]
GRADLE_USER_HOME = '{{config_root}}/.gradle'

[tasks.setup]
description = 'Prepare the Forge 1.6.4 development workspace'
run = 'gradle setupCIWorkspace --no-daemon'

[tasks.build]
description = 'Build the default Minecraft port (pass -PmcVersion=... to select another)'
run = 'gradle build --no-daemon --stacktrace'

[tasks.format]
description = 'Format Java sources with the project-pinned formatter'
run = 'gradle formatJava --no-daemon'

[tasks.prism]
description = 'Build, prepare and launch a dedicated Prism test instance (argument: Minecraft version)'
run = 'python scripts/prism.py'

[tasks."prism:prepare"]
description = 'Build and prepare a Prism test instance without launching it'
run = 'python scripts/prism.py --prepare-only'
