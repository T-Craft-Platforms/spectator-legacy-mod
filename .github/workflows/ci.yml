name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: |
          python3 -m unittest discover -s scripts/tests -v
          echo "matrix=$(python3 scripts/build.py matrix --status buildable)" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install target Gradle
        if: ${{ matrix.gradle != '' }}
        env:
          GRADLE_VERSION: ${{ matrix.gradle }}
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Prepare target-specific toolchain
        if: ${{ matrix.setup != '' }}
        env:
          SETUP_SCRIPT: ${{ matrix.setup }}
        run: python3 "$SETUP_SCRIPT"
      - run: python3 scripts/build.py build "${{ matrix.minecraft }}"
