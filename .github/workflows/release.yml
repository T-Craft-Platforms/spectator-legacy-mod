name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', tag):
              raise SystemExit('Invalid release tag: ' + tag)
          PY
          python3 -m unittest discover -s scripts/tests -v
          matrix=$(python3 scripts/build.py matrix --status release-ready)
          if [[ "$matrix" == '[]' ]]; then echo 'No release-ready targets' >&2; exit 1; fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install target Gradle
        if: ${{ matrix.gradle != '' }}
        env:
          GRADLE_VERSION: ${{ matrix.gradle }}
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
      - name: Prepare target-specific toolchain
        if: ${{ matrix.setup != '' }}
        env:
          SETUP_SCRIPT: ${{ matrix.setup }}
        run: python3 "$SETUP_SCRIPT"
      - name: Build release jar
        env:
          TAG: ${{ github.ref_name }}
          MC: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          python3 scripts/build.py clean-build "$MC" --mod-version "${TAG#v}"
          jar=$(python3 scripts/build.py artifact "$MC" --mod-version "${TAG#v}")
          mkdir dist
          cp "$jar" "dist/spectatorlegacy-${TAG#v}-mc${MC}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --draft)
          [[ "$TAG" != *-* ]] || args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" dist/*.jar
