name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['TAG']
          if not re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?', tag):
              raise SystemExit('Invalid release tag: ' + tag)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 3
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-3.0-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-3.0/bin" >> "$GITHUB_PATH"
      - name: Build every buildable port
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          mapfile -t targets < <(python3 -c 'import json; print("\n".join(k for k,v in json.load(open("versions.json"))["targets"].items() if v["status"] == "buildable"))')
          test "${#targets[@]}" -gt 0
          for mc in "${targets[@]}"; do
            gradle clean setupCIWorkspace build "-PmcVersion=$mc" "-PmodVersion=${TAG#v}" --no-daemon
            shopt -s nullglob
            jars=(build/"$mc"/libs/spectatorlegacy-mc"$mc"-*.jar)
            test "${#jars[@]}" -eq 1
            cp "${jars[0]}" "dist/spectatorlegacy-${TAG#v}-mc${mc}.jar"
          done
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --draft)
          [[ "$TAG" != *-* ]] || args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" dist/*.jar
